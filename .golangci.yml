version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errname
    - errorlint
    - gocognit
    - gocritic
    - gosec
    - misspell
    - modernize
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - revive
    - sloglint
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    govet:
      enable-all: true
      disable: [fieldalignment]
    sloglint:
      no-mixed-args: true
      static-msg: true
  exclusions:
    presets: [std-error-handling, common-false-positives]
    rules:
      # Tests build requests with httptest.NewRequest and short-lived
      # clients against httptest servers; a context adds nothing there.
      - path: _test\.go
        linters: [gosec, gocognit, noctx]

formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/pequin/go-shorturl]
